<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="control-token" content="%CONTROL_TOKEN%">
  <title>Spy Car</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/control.js" defer></script>
</head>
<body>
  <main class="controller" aria-label="Car remote control">
    <div class="status-row">
      <span id="connection-dot" class="status-dot" aria-hidden="true"></span>
      <p id="status" role="status" aria-live="polite">Connecting…</p>
      <span id="battery">— V</span>
    </div>
    <div class="controls">
      <div id="joystick" class="joystick" role="group" aria-label="Hold and drag joystick" aria-disabled="true" aria-describedby="drive-hint">
        <div id="knob" class="knob"></div>
      </div>
    </div>
    <div class="sr-only">
      <p id="drive-hint">Hold and drag to drive. Further from the center means faster. Release to stop.</p>
      <span id="drive-state">Stopped</span><span id="speed">0</span>%
    </div>
  </main>
</body>
</html>
