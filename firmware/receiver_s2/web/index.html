<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f5">
  <meta name="control-token" content="%CONTROL_TOKEN%">
  <title>Spy Car · Drive</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/control.js" defer></script>
</head>
<body>
  <main class="controller">
    <header>
      <p class="eyebrow">DIAGONAL SPY CAR</p>
      <div class="heading"><h1>Take the wheel.</h1><span id="battery" class="battery">— V</span></div>
      <p class="intro">Hold and drag to drive. Let go to stop.</p>
    </header>
    <section class="drive-card" aria-label="Driving controls">
      <div class="status-row"><span id="connection-dot" class="status-dot"></span><p id="status" role="status" aria-live="polite">Connecting…</p></div>
      <div class="joystick-area">
        <span class="direction forward">↑ <span>Forward</span></span>
        <span class="direction left">← <span>Left</span></span>
        <div id="joystick" class="joystick" role="group" aria-label="Hold and drag joystick" aria-disabled="true" aria-describedby="drive-hint">
          <div class="crosshair horizontal"></div><div class="crosshair vertical"></div>
          <div class="joystick-ring"></div>
          <div id="knob" class="knob"><span class="knob-mark">✦</span></div>
        </div>
        <span class="direction right"><span>Right</span> →</span>
        <span class="direction backward"><span>Backward</span> ↓</span>
      </div>
      <div class="drive-readout"><span id="drive-state">Stopped</span><span><strong id="speed">0</strong><span class="percent">%</span></span></div>
      <p id="drive-hint" class="hint">Further from the center means faster.</p>
      <button id="stop" type="button">Stop <span aria-hidden="true">■</span></button>
    </section>
    <footer>Keep the car in sight. Disconnect its battery when finished.</footer>
  </main>
</body>
</html>
